name: Release

# GDS-native automated release. On push to main, semantic-release computes the
# next version from conventional commits, creates a git tag + GitHub Release with
# notes; if (and only if) a release was cut, a traceable Docker image is built and
# pushed to GHCR under the GDS namespace. No wyre reusable workflows, no registry
# token for the SDK (autotask-node is the public github: fork).
#
# .releaserc.json has no @semantic-release/git plugin, so nothing is pushed back
# to main; the release version lives in the git tag / GitHub Release, and the
# Dockerfile bakes it into the image (and /health) via the VERSION build-arg.

on:
  push:
    branches: [main]

permissions:
  contents: write        # create tags + GitHub Releases
  issues: write          # semantic-release/github comments
  pull-requests: write   # semantic-release/github comments
  packages: write        # push image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Record current release tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Detect new release
        id: detect
        run: |
          NEW="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          if [ "$NEW" != "${{ steps.before.outputs.tag }}" ] && [ "$NEW" != "none" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
            echo "Released $NEW"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release cut for this push."
          fi

  docker:
    name: Build & push image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push (token-free SDK, traceable)
        run: |
          IMAGE="ghcr.io/gdstechnology/autotask-mcp"
          VER="${{ needs.release.outputs.version }}"
          docker build \
            --build-arg VERSION="${VER}" \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}:${VER}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${VER}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${VER} (and :latest)"
